services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: musicrec
      POSTGRES_USER: musicrec
      POSTGRES_PASSWORD: musicrec
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    ports:
      - "12345:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U musicrec -d musicrec"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://musicrec:musicrec@db:5432/musicrec
      MIN_NEW_PLAYLISTS: 10
      FINETUNE_LR: 1e-4
    volumes:
      - model_data:/app/models
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  model_data:
